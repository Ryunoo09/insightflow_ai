version: "2"
sql:
  - engine: "postgresql"
    schema:
      - "db/migrations/000001_init_schema.up.sql"
      - "db/migrations/000002_dataset_pipeline.up.sql"
      - "db/migrations/000003_dataset_management.up.sql"
    queries: "db/queries"
    gen:
      go:
        package: "dbgen"
        out: "internal/platform/dbgen"
        sql_package: "pgx/v5"
